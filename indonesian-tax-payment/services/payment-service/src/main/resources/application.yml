server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/payment_db
    username: ${POSTGRES_USER:taxpay}
    password: ${POSTGRES_PASSWORD:taxpay_local_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        max.block.ms: 5000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "id.co.taxpay.*"
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: payment-service

services:
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8083}
  core-banking:
    url: ${CORE_BANKING_URL:http://localhost:8084}
  tax-gateway:
    url: ${TAX_GATEWAY_URL:http://localhost:8085}

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      billing:
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
      coreBanking:
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
      taxGateway:
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
    instances:
      billing:
        baseConfig: billing
      coreBanking:
        baseConfig: coreBanking
      taxGateway:
        baseConfig: taxGateway
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      billing:
        maxAttempts: 2
        waitDuration: 500ms
      coreBanking:
        maxAttempts: 2
        waitDuration: 500ms
      taxGateway:
        maxAttempts: 2
        waitDuration: 500ms
    instances:
      billing:
        baseConfig: billing
      coreBanking:
        baseConfig: coreBanking
      taxGateway:
        baseConfig: taxGateway

taxpay:
  mock:
    scenario: ${MOCK_SCENARIO:NONE}
  outbox:
    enabled: true
    poll-ms: 1000
    batch-size: 50
    max-attempts: 5
    base-backoff-ms: 1000
    max-backoff-ms: 300000
    send-timeout-seconds: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    id.co.taxpay: INFO

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-please-32bytes-min}
